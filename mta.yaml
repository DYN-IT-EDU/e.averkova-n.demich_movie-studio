_schema-version: 3.3.0
ID: movie-studio
description: A simple CAP project.
version: 1.0.0
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - mkdir -p resources

modules:
- name: movie-studio-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: movie-studio-db
  - name: movie-studio-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm

- name: movie-studio-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: movie-studio-db
  parameters:
    buildpack: nodejs_buildpack

- name: movie-studio
  type: approuter.nodejs
  path: app/router
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
  - name: movie-studio-auth
  - name: movie-studio-html5-runtime
  - name: movie-studio-destination-service
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  parameters:
    disk-quota: 256M
    keep-existing-routes: true
    memory: 256M

- name: movie-studio-app-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: movie-studio-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources/
    requires:
      - artifacts:
          - sapcapiremoviestudiofilms.zip
        name: sapcapiremoviestudiofilms
        target-path: resources/

- name: sapcapiremoviestudiofilms
  type: html5
  path: app/films
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build
    supported-platforms: []

resources:
- name: movie-studio-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared

- name: movie-studio-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: movie-studio-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application

- name: movie-studio-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host

- name: movie-studio-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime

- name: movie-studio-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: movie-studio-destination-service
    service-plan: lite